name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: production
      VITE_CONVEX_URL: https://example.convex.cloud

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
      - name: Check
        run: vp check
      - name: Build
        run: vp build
      - name: Test production SSR
        run: vp run test:ssr
      - name: Run Knip
        run: vp exec knip

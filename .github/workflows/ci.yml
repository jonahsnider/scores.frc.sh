name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: production
      VITE_CONVEX_URL: https://example.convex.cloud

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - parallel:
          - name: Check
            run: vp check
          - name: Build
            run: vp build
          - name: Run Knip
            run: vp exec knip
      - name: Test production SSR
        run: vp run test:ssr
